# Aucun secret ici : tout vient des variables d'environnement. La clé est montée sur /secrets (ou ~/keys en local).
mutuelle_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_FILE') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORM_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORM_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'MUTUELLE_FRAUD') }}"
      schema: SILVER
      threads: 4
