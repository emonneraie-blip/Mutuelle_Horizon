# Airflow sur la machine de démo (un seul conteneur, mode "standalone" : interface web + scheduler).
# Démarrer :  docker compose up -d        Interface : http://localhost:8080
# Arrêter :   docker compose down
services:
  airflow:
    build: .
    image: mutuelle-airflow:1.0.0
    command: standalone
    ports:
      - "8080:8080"
    env_file: .env                                  # chemins, comptes, webhook : jamais commité
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Europe/Paris"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      # Airflow lance les conteneurs fraud-ingest et fraud-dbt sur le Docker de la machine
      - /var/run/docker.sock:/var/run/docker.sock
    # Raccourci de TD : root est nécessaire pour utiliser le socket Docker sur un portable.
    # En production, les tâches tourneraient sur Kubernetes et rien ne tournerait en root.
    user: "0:0"
